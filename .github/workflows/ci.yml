name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pnpm-install

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Check types
        run: pnpm type-check

      # The API reference in apps/docs is generated from the v1 route. A
      # stale committed spec means an endpoint changed without its docs.
      - name: Check the committed OpenAPI spec matches the code
        run: pnpm check:openapi

  sherif:
    name: Sherif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run sherif
        run: pnpm dlx sherif@latest

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Third-party actions are normally pinned by tag here, but Trivy's own
      # action had its tags rewritten in March 2026, so this one is pinned by
      # commit. v0.36.0 is an immutable release; bump by looking up the new
      # tag's commit, not by changing the tag alone.
      - name: Scan for secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      # Report only for now: the lockfile has fixable HIGH/CRITICAL findings
      # that need a dependency update pass first. Set exit-code to "1" once
      # that is done so new ones fail the build.
      - name: Report vulnerable dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pnpm-install

      - name: Check linting rules
        run: pnpm turbo check

      - name: Check feature folder structure
        run: pnpm check:structure

      - name: Check locale files for unbalanced braces
        run: pnpm check:locales

      - name: Check User cascade relations are covered by the guest purge
        run: pnpm check:cascades

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pnpm-install

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run tests
        run: pnpm test:unit

  docker-smoke-test:
    name: Docker smoke test
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58 has no
    # Chromium build for. Bump once Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Shell exports don't reach the container. The env_file
      # (apps/web/.env) is how the stack reads config, and --env-file makes
      # compose interpolate POSTGRES_* from the same file, so write the
      # documented-required variables there.
      - name: Start services
        run: |
          cat > apps/web/.env <<'EOF'
          SECRET_PASSWORD=0123456789abcdef0123456789abcdef
          SUPPORT_EMAIL=support@example.com
          NEXT_PUBLIC_BASE_URL=http://localhost:3000
          POSTGRES_PASSWORD=postgres
          EOF
          docker compose --env-file apps/web/.env up -d --build --wait --wait-timeout 60

      # The image healthcheck hits /api/status, but that endpoint returns
      # 200 even when the database is unreachable and doesn't touch env
      # validation — assert both explicitly so a booted-but-broken stack
      # fails here.
      - name: Check status endpoint and login page respond
        run: |
          status=$(curl -fsS --connect-timeout 5 --max-time 15 \
            http://localhost:3000/api/status)
          echo "$status"
          echo "$status" | jq -e '.database == "connected"'
          curl -fsSL --connect-timeout 5 --max-time 15 \
            -o /dev/null http://localhost:3000/login

      # Scans what the stack is actually running, so the base image, apt
      # packages and the npm bundled with Node are covered, not just the
      # lockfile. Report only, for the same reason as the dependency scan in
      # the Trivy job; the image currently carries fixable HIGH/CRITICAL
      # findings in Debian, Next.js and the bundled npm.
      - name: Find the image the stack runs
        id: image
        run: |
          container=$(docker compose --env-file apps/web/.env ps -q rallly_selfhosted)
          echo "id=$(docker inspect --format '{{.Image}}' "$container")" >> "$GITHUB_OUTPUT"

      - name: Report vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.id }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pnpm-install

      - name: Install Playwright browser
        run: pnpm --filter @rallly/web exec playwright install --with-deps chromium

      # A crashed client bundle still serves 200s; only a browser loading
      # the page catches that class of failure.
      - name: Run browser smoke test against the image
        run: pnpm --filter @rallly/web exec playwright test --config playwright.smoke.config.ts

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file apps/web/.env logs

  # Resolves the @playwright/test version from the lockfile so the container
  # image tag below stays in sync with it automatically.
  playwright-version:
    name: Resolve Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          version=$(awk "/'@playwright\/test':/{getline; getline; if(\$1==\"version:\"){print \$2; exit}}" pnpm-lock.yaml)
          if [ -z "$version" ]; then
            echo "Could not resolve @playwright/test version from pnpm-lock.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved Playwright version: $version"

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: playwright-version
    # Uses the Playwright image (browsers preinstalled); tag must stay v<version>-noble.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    env:
      # Services are reached by network alias (the job is containerized, so not localhost).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rallly
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rallly
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API_URL: http://mailpit:8025/api
      # Point Playwright at the image's preinstalled browsers (HOME is /github/home in-container).
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CI: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rallly
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8025/readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/pnpm-install

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Create production build
        run: pnpm turbo build:test --filter=@rallly/web

      - name: Setup database
        run: pnpm db:deploy

      - name: Run tests
        # Run directly, not via turbo, so the job env reaches the test process.
        run: pnpm --filter @rallly/web test:integration

      - name: Upload artifact playwright-report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./apps/web/playwright-report
