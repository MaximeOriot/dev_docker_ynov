name: Build rallly_selfhosted image (dev)
# -----------------------------------------------------------------
# Workflow Purpose:
#   Builds the self-hosted Rallly image (same Dockerfile and build
#   args as the `rallly_selfhosted` service in docker-compose.yml)
#   so it can be run on a local web server while developing features.
#
# Outputs:
#   1. Image exported as a tarball artifact (docker load -i ...)
#   2. Image pushed to GHCR: ghcr.io/<owner>/rallly_selfhosted
#      (not on pull requests: forks have no write access to packages)
#
# Test: every build is smoke tested before export/push with
#       scripts/smoke-test-image.sh (Postgres + migrations + /api/status).
#
# Trigger: pull requests, push to main, or manually on any branch
#          (workflow_dispatch) to export an image of a feature branch.
# -----------------------------------------------------------------
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rallly_selfhosted

jobs:
  build:
    name: Build & export image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: branch name, pr-<number>, short sha, and `latest` on the
      # default branch.
      # metadata-action lowercases the image name, as GHCR requires.
      - name: Generate Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Single build, loaded into the local daemon so the same image
      # is both exported and pushed.
      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=dev-${{ github.sha }}
            SELF_HOSTED=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Image
        run: scripts/smoke-test-image.sh "$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"

      - name: Export Image Tarball
        run: |
          first_tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker save "$first_tag" | gzip > rallly_selfhosted.tar.gz
          ls -lh rallly_selfhosted.tar.gz

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rallly_selfhosted-${{ github.sha }}
          path: rallly_selfhosted.tar.gz
          retention-days: 7
          compression-level: 0

      - name: Push Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            docker push "$tag"
          done
