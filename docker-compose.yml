services:
  rallly_db:
    image: postgres:18-alpine
    restart: always
    ports:
      # Loopback only: the app reaches the database over the compose
      # network, so the host port is just for local tooling.
      - "127.0.0.1:5450:5432"
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      # Values come from apps/web/.env: run compose with
      # `--env-file apps/web/.env`
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/web/.env}
      - POSTGRES_DB=${POSTGRES_DB:-rallly}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rallly_selfhosted:
    build:
      args:
        - SELF_HOSTED=true
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    depends_on:
      rallly_db:
        condition: service_healthy
    ports:
      - 3000:3000
    environment:
      # URL-encode the password if it contains reserved characters
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@rallly_db/${POSTGRES_DB:-rallly}
    env_file:
      - path: apps/web/.env
        required: false

volumes:
  db-data:
    driver: local
